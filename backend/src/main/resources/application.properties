spring.application.name=eventrush

spring.datasource.url=jdbc:mysql://localhost:3306/eventrush?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=yourpassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Explicit dialect - without this, Hibernate needs a LIVE database
# connection at startup just to auto-detect which SQL dialect to
# generate ("Unable to determine Dialect without JDBC metadata").
# Setting it explicitly removes that specific failure mode entirely;
# Hibernate already knows it's talking to MySQL without having to ask.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# HikariCP, by default, fails almost immediately if it can't get a
# valid connection when the pool starts up - which is exactly what
# was happening: MySQL not being 100% ready yet crashed the whole
# app instantly instead of just... waiting a bit. This makes the
# pool keep retrying for up to 60s before giving up for real, which
# is a more robust fix than tuning docker-compose healthcheck timers
# to guess the exact right delay - the app now tolerates a slow-to-
# start database on its own, regardless of what's causing the delay.
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000

# MySQL default isolation is REPEATABLE_READ. We rely on
# SELECT ... FOR UPDATE (pessimistic lock) inside a @Transactional
# method for the seat row, so this default is fine for our use case.

server.port=8080

# Redis - used for the shared (cross-instance) rate limiter and booking queue.
# Default localhost:6379 - works with a plain `docker run -p 6379:6379 redis`
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Connection pooling (needs commons-pool2 on the classpath - see pom.xml
# comment). Without this, Lettuce shares ONE physical connection for every
# Redis call app-wide. RedisBookingQueueService's worker loop holds that
# connection in a blocking BRPOP for up to 5s at a stretch, so anything
# else needing Redis (including the push that enqueues a new booking)
# gets stuck behind it - bookings time out even with no real load.
# Pooling gives each operation its own borrowed connection instead.
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000ms