# Single entry point for the whole app. This nginx does THREE jobs at
# once, matching the corrected architecture:
#   1. Web server  - serves the React app's static build directly
#   2. Reverse proxy - forwards /api/* to the Spring Boot layer
#   3. Load balancer - round-robins those /api/* requests across
#      app1 and app2
#
# The browser only ever talks to THIS container. There used to be a
# second nginx hop (the frontend's own container proxying to this one)
# - that's gone now. One hop: browser -> here -> either static files
# or app1/app2.

upstream eventrush_backend {
    server app1:8080;
    server app2:8080;
}

server {
    listen 80;

    # /api/* -> Spring Boot, load balanced (round robin) between the
    # two stateless instances.
    location /api/ {
        proxy_pass http://eventrush_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /* -> the React app's static build. try_files falls back to
    # index.html so client-side routing survives a hard refresh on any
    # route (e.g. /events/42) instead of 404ing.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
